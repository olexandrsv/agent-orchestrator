<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>agent-orchestrator</title>
    <link rel="stylesheet" href="tabs.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ui/arrow/style.css">
    <link rel="stylesheet" href="ui/connection/style.css">
    <link rel="stylesheet" href="ui/line/style.css">
    <link rel="stylesheet" href="agent/style.css">
</head>
<body>    
    <div id="agents"></div>

    <div id="connections"></div>
    <div class="entity-state">
        <div class="state-header">
            <button class="close-btn" id="closeWindow" aria-label="Close"></button>
        </div>
        <div class="tabs">
            <div class="tab-buttons">
                <button id="infoTab" class="tab-btn active" data-tab="Info">Info</button>
                <button id="logsTab" class="tab-btn" data-tab="Logs">Logs</button>
            </div>

            <pre class="tab-content active" id="info"></pre>
            <pre class="tab-content" id="logs"></pre>

        </div>
    </div>
    <textarea id="request" class="input-area"></textarea>
    
    <script type="module" src="script.js"></script>
    <script type="module" src="core/controller.js"></script>
    <script type="module" src="core/agent.js"></script>
    <script type="module" src="core/connection.js"></script>
    <script type="module" src="core/model.js"></script>
    <script type="module" src="core/presentation.js"></script>
    <script type="module" src="core/team.js"></script>
    <script type="module" src="ui/line/script.js"></script>
    <script type="module" src="agent/script.js"></script>
    <script type="module" src="ui/arrow/script.js"></script>
    <script type="module" src="ui/connection/script.js"></script>
</body>
</html>
